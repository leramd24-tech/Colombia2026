<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#10231c;--sel:#0f3d2e;--sel2:#1c5a45;--mist:#f2f5ef;--line:#dde5d9;--sun:#f2b134;--mut:#58685f}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:16px/1.55 'Instrument Sans',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--mist);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3,h4{font-family:'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.02em;line-height:1.1}
a{color:inherit}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#nav{position:fixed;z-index:30;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:#0f3d2eea;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#nav b{display:none;font:800 20px 'Bricolage Grotesque',sans-serif;color:#fff}
#nav button{color:#cfe0d6;padding:9px 12px;border-radius:99px;font-size:13px;font-weight:600}
#nav button[aria-current=true]{background:var(--sun);color:var(--ink)}
.ph{position:relative;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h) 34% 24%),hsl(var(--h2) 38% 40%)) center/cover}
.ph>b{position:absolute;left:14px;bottom:12px;color:#ffffffb5;font:600 13px 'Bricolage Grotesque',sans-serif}
.ph.on>b{display:none}
.sw{position:absolute;right:10px;top:10px;background:#000a;color:#fff;border-radius:99px;padding:5px 11px;font-size:12px;opacity:0;transition:opacity .2s}
.ph.on .sw{opacity:1}
.hero{position:relative;min-height:88svh;display:flex;align-items:flex-end;color:#fff}
.hero .hb{position:absolute;inset:0}.hero .sw{display:none}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,#07241a55 0,#07241a00 35%,#07241aee 100%)}
.hc{position:relative;max-width:1120px;width:100%;margin:auto;padding:0 20px 56px}
.hc h1{font-size:clamp(64px,17vw,168px);font-weight:800;line-height:.88;margin:10px 0 18px}
.hc .lead{max-width:34ch;font-size:19px;color:#e8f1ea}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border-radius:99px;font-weight:600;text-decoration:none;background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sun{background:var(--sun);border-color:var(--sun)}.btn.ghost{background:#ffffff22;color:#fff;border-color:#ffffff66}
.btn.sm{padding:9px 15px;font-size:14px}
.wrap{max-width:1120px;margin:auto;padding:36px 20px}
h2{font-size:clamp(28px,5vw,42px);margin-bottom:6px}.sub{color:var(--mut);margin-bottom:22px;max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.tile strong{display:block;font:800 30px 'Bricolage Grotesque',sans-serif}.tile span{color:var(--mut);font-size:14px}
.tile svg{float:right}
.mapc{background:radial-gradient(circle at 30% 20%,#1c5a45,#0b2a20);border-radius:28px;padding:16px;display:grid;gap:12px;color:#fff}
.mapc svg{width:100%;max-height:560px}.mapc text{font:600 12px 'Instrument Sans',sans-serif;fill:#e9f3ec}
.mapc g[data-dest]{cursor:pointer}
.note{background:#fff7e0;border:1px solid #f0dca0;border-radius:14px;padding:14px 16px;font-size:14px;margin-top:20px}
.scroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;margin:0 -20px;padding-inline:20px}
.dc{flex:0 0 min(72vw,280px);scroll-snap-align:start;border-radius:22px;overflow:hidden;color:#fff;text-align:left;position:relative;aspect-ratio:3/4}
.dc .ph{position:absolute;inset:0}.dc .sw{display:none}
.dc div.t{position:absolute;inset:auto 0 0;padding:44px 16px 16px;background:linear-gradient(transparent,#06201699 60%,#062016dd)}
.dc h3{font-size:22px}.dc small{opacity:.85}
.chips{position:sticky;top:0;z-index:15;display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:#f2f5efec;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

.chips small{display:block;font:500 11px 'Instrument Sans',sans-serif;color:var(--mut)}
.chips button[aria-selected=true]{background:var(--sel);color:#fff;border-color:var(--sel)}.chips button[aria-selected=true] small{color:#bfd6c9}
.chips button.ok:after{content:" ✓";font-size:13px;color:var(--sun)}

.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}

.stops{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));margin-top:22px}
.stop{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:opacity .2s}
.stop .sp{aspect-ratio:16/10}.sb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.sb time{font:700 14px 'Bricolage Grotesque',sans-serif;color:var(--sel2)}.sb h3{font-size:21px}.sb p{color:var(--mut);font-size:15px;flex:1}
.ac{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.stop.np{background:transparent;border-style:dashed}
.stop.done{opacity:.62}.stop.done .chk{background:var(--sel);color:#fff;border-color:var(--sel)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
details{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:10px;padding:4px 18px}
summary{cursor:pointer;padding:14px 0;font:700 20px 'Bricolage Grotesque',sans-serif;list-style:none}
details[open] summary{border-bottom:1px solid var(--line)}details>div{padding:12px 0 16px;display:grid;gap:8px}
details a{color:var(--sel2);font-weight:600}
.f{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.f input{width:130px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;font:inherit;text-align:right;background:#fff}
.tot{background:var(--sel);color:#fff;border-radius:22px;padding:22px;margin-top:18px}.tot strong{display:block;font:800 40px 'Bricolage Grotesque',sans-serif}

.ck{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer}
.ck input{width:22px;height:22px;accent-color:var(--sel);flex:none}.ck input:checked+span{text-decoration:line-through;opacity:.55}
h3.g{margin:22px 0 10px;font-size:22px}
footer{padding:10px 20px 30px;text-align:center;color:var(--mut);font-size:13px}
@media(min-width:800px){body{padding:0}#nav{top:0;bottom:auto;justify-content:flex-end;gap:6px;padding:12px 28px}#nav b{display:block;margin-right:auto}.chips{top:62px;justify-content:center}.stats{grid-template-columns:repeat(4,1fr)}.mapc{grid-template-columns:1fr 1fr;align-items:center;padding:28px}.scroll{margin:0;padding-inline:0}.dc{flex-basis:260px}.wrap{padding:48px 28px}.hc{padding:0 28px 72px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

const BD=[['pax','Personas',2],['fuel','Combustible (total)',600000],['toll','Peajes (total)',300000],['hot','Alojamiento por noche (por habitación)',220000],['rooms','Habitaciones',1],['food','Comida por persona al día',90000],['act','Actividades por persona (total)',450000],['ext','Imprevistos (%)',10]];
const CK=[['Carro',['SOAT vigente','Revisión técnico-mecánica al día','Licencia, tarjeta de propiedad y seguro a mano','Revisar frenos, llantas, luces, aceite y llanta de repuesto','Kit de carretera y cargador para el celular']],
['Reservas',['Alojamiento de las 9 noches, sobre todo Jardín (festivo 8 dic) y Santa Rosa de Cabal','Actividades en el Cañón del Río Claro','Ingreso a la Piedra del Peñol y al teleférico de Jardín, si aplica','Termales de Santa Rosa de Cabal','Alojamiento en Ibagué','Tour de la Comuna 13']],
['Ruta',['Descargar mapas sin conexión en Google Maps','Revisar el estado de las vías, en especial La Línea y Jericó–Jardín','Efectivo para peajes y pueblos con poca señal','Consultar pico y placa en Medellín']],
['Maleta',['Impermeable y calzado cómodo para caminatas','Ropa fresca para Río Claro y abrigo ligero para la noche','Traje de baño y toalla para los termales','Protector solar y repelente','Documento de identidad']]];
const PT=[['Fusagasugá',4.337,-74.364,9,[-8,-6,'end']],['Río Claro',5.90,-74.86,0,[10,4,'start']],['Guatapé',6.233,-75.16,1,[10,-4,'start']],['Medellín',6.244,-75.581,2,[-2,-14,'middle']],['Jericó',5.79,-75.786,4,[12,4,'start']],['Jardín',5.598,-75.819,5,[12,5,'start']],['Santa Rosa',4.868,-75.621,6,[12,4,'start']],['Ibagué',4.438,-75.232,8,[12,4,'start']]];
const hue=s=>Math.abs([...s].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))%360;
const ph=(q,cls='',i=0)=>{const h=hue(q);return `<div class="ph ${cls}" data-q="${q}" data-i="${i}" style="--h:${h};--h2:${(h+35)%360}"><b>${q}</b><button class="sw" data-sw>↻ Otra foto</button></div>`};
const mem={},used=new Set(),BAD=/svg|flag|bandera|escudo|logo|mapa|map_|locator|coat/i;
let fail=0,okc=0;
const bad=()=>{if(++fail>=3&&!okc&&!$('#warn')){const w=document.createElement('div');w.id='warn';w.className='note';w.style.cssText='margin:12px 20px;position:relative;z-index:5';w.innerHTML='<b>No se pudieron cargar las fotos.</b> Necesitan internet y abrir este archivo directamente en Safari o Chrome (no desde la vista previa de otra app). Descárgalo, ábrelo ahí y recarga.';document.body.insertBefore(w,$('#app'))}};
async function J(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);try{return await (await fetch(u,{signal:c.signal})).json()}finally{clearTimeout(t)}}
const pg=j=>Object.values((j.query||{}).pages||{}).sort((a,b)=>a.index-b.index);
async function cands(q){if(mem[q])return mem[q];try{const s=localStorage.getItem('ph:'+q);if(s){const v=JSON.parse(s);if(v.length)return mem[q]=v}}catch(e){}
let out=[];
try{out=pg(await J('https://es.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=6&prop=pageimages&piprop=thumbnail&pithumbsize=1100&gsrsearch='+enc(q))).map(p=>p.thumbnail&&p.thumbnail.source).filter(u=>u&&!BAD.test(u)).slice(0,3)}catch(e){}
try{out=out.concat(pg(await J('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=14&prop=imageinfo&iiprop=url|size|mime&iiurlwidth=1100&gsrsearch='+enc(q))).map(x=>({i:(x.imageinfo||[])[0],t:x.title})).filter(o=>o.i&&/jpe?g|png/.test(o.i.mime)&&o.i.width>=700&&!BAD.test(o.t)).map(o=>o.i.thumburl).slice(0,6))}catch(e){}
out=[...new Set(out)];if(out.length){mem[q]=out;try{localStorage.setItem('ph:'+q,JSON.stringify(out))}catch(e){}}return out}
async function load(el,n=0){let c=[];try{c=await cands(el.dataset.q)}catch(e){}if(!c.length)return bad();const i=+el.dataset.i;let k=0;while(k<c.length-1&&used.has(c[(i+k)%c.length]))k++;const u=c[(i+k)%c.length],im=new Image();
im.onload=()=>{okc++;used.add(u);el.style.backgroundImage=`url("${u}")`;el.classList.add('on')};
im.onerror=()=>{if(n<c.length){el.dataset.i=i+k+1;load(el,n+1)}else bad()};im.src=u}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);load(e.target)}}),{rootMargin:'500px'});
const watch=()=>document.querySelectorAll('.ph:not([data-w])').forEach(e=>{e.dataset.w=1;io.observe(e)});
const dayDone=i=>D[i].s.every((s,k)=>!s[3]||st.done[i+'-'+k]);
const prog=()=>{let t=0,d=0;D.forEach((x,i)=>x.s.forEach((s,k)=>{if(s[3]){t++;if(st.done[i+'-'+k])d++}}));CK.forEach((g,gi)=>g[1].forEach((_,k)=>{t++;if(st.chk[gi+'-'+k])d++}));return[d,t]};
function mapSVG(){const k=210,P=PT.map(p=>({n:p[0],x:(p[2]+75.95)*k+30,y:(6.45-p[1])*k+20,d:p[3],l:p[4]}));
const path=P.slice(1).map((p,i)=>(i?'L':'M'+P[0].x+' '+P[0].y+' L')+p.x+' '+p.y).join(' ');
return `<svg viewBox="0 0 400 510" role="img" aria-label="Esquema de la ruta"><path d="${path.replace('ML','M').replace(/^M/,'M')}" fill="none" stroke="#f2b134" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${P.map(p=>`<g data-dest="${p.d==9?0:p.d}"><circle cx="${p.x}" cy="${p.y}" r="${p.d==9?7:11}" fill="${p.d<9&&dayDone(p.d)?'#f2b134':'#0b2a20'}" stroke="#f2b134" stroke-width="2.5"/>${p.d<9?`<text x="${p.x}" y="${p.y+4}" text-anchor="middle" style="fill:${dayDone(p.d)?'#10231c':'#fff'};font-weight:800">${p.d+1}</text>`:''}<text x="${p.x+p.l[0]}" y="${p.y+p.l[1]}" text-anchor="${p.l[2]}">${p.n}</text></g>`).join('')}</svg>`}
function home(){const[d,t]=prog(),pc=Math.round(d/t*100),C=2*Math.PI*20;
return `<header class="hero">${ph('Embalse de Guatapé','hb')}<div class="shade"></div><div class="hc"><p>Fusagasugá · Antioquia · Eje Cafetero · Ibagué</p><h1>Colombia<br>2026</h1><p class="lead">Diez días en carro entre cañones, embalses, pueblos de montaña y termales, de Fusagasugá a Ibagué.</p><div class="row"><button class="btn sun" data-go="itin">Ver itinerario</button><a class="btn ghost" target="_blank" rel="noopener" href="${FULL}">Ruta completa en Maps</a></div></div></header>
<section class="wrap"><div class="stats"><div class="tile"><strong>3–12 dic</strong><span>2026, jueves a sábado</span></div><div class="tile"><strong>10 días</strong><span>9 noches en 7 destinos</span></div><div class="tile"><strong>≈1.050 km</strong><span>de carretera, aproximado</span></div><div class="tile"><svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="20" fill="none" stroke="#dde5d9" stroke-width="6"/><circle cx="26" cy="26" r="20" fill="none" stroke="#1c5a45" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C*pc/100} ${C}" transform="rotate(-90 26 26)"/></svg><strong>${pc}%</strong><span>${d} de ${t} pendientes listos</span></div></div></section>
<section class="wrap" style="padding-top:0"><div class="mapc"><div><h2 style="color:#fff">Tu ruta</h2><p style="color:#cfe0d6;margin-bottom:16px">Toca un punto para abrir ese día. El número marca el día en que llegas; se llena cuando completas sus actividades.</p><a class="btn sun" target="_blank" rel="noopener" href="${FULL}">Abrir ruta en Google Maps</a><p style="color:#9fb9ab;font-size:13px;margin-top:14px">Esquema ilustrativo, no es un mapa de carreteras.</p></div>${mapSVG()}</div>
<div class="note"><b>Fechas a tener en cuenta:</b> la noche del 7 de diciembre es el Día de las Velitas y el 8 es festivo en Colombia. Espera más tráfico y menos disponibilidad de alojamiento, sobre todo en Jericó y Jardín.</div></section>
<section class="wrap" style="padding-top:0"><h2>Destinos</h2><p class="sub">Siete paradas, de los cañones de Antioquia al Tolima.</p><div class="scroll">${DEST.map(x=>`<button class="dc" data-dest="${x[2]}">${ph(x[1])}<div class="t"><h3>${x[0]}</h3><small>${x[3]}</small></div></button>`).join('')}</div></section>`}
const stop=(s,k)=>{const[h,n,t,q,m]=s,key=st.day+'-'+k,dn=st.done[key];return `<article class="stop${dn?' done':''}${q?'':' np'}">${q?ph(q,'sp'):''}<div class="sb"><time>${h}</time><h3>${n}</h3><p>${t}</p><div class="ac"><a class="btn sm" target="_blank" rel="noopener" href="${MQ((m||q||n)+(/,/.test(m||'')?'':', Colombia'))}">Abrir en Maps</a>${q?`<button class="btn sm chk" data-done="${key}" aria-pressed="${!!dn}">${dn?'Completada ✓':'Marcar completada'}</button>`:''}</div></div></article>`};
function itin(){const x=D[st.day],i=st.day;
return `<div class="chips">${D.map((y,j)=>`<button data-day="${j}" aria-selected="${j==i}" class="${dayDone(j)?'ok':''}">${y.d[1].split(' ')[0]}<small>${y.d[0]}</small></button>`).join('')}</div>
<section class="wrap"><div class="dh">${ph(x.hq,'hb',1)}<div class="dt"><p>Día ${i+1} de 10 · ${x.d[0]} ${x.d[1]}</p><h2>${x.t}</h2></div></div>
<div class="meta"><div class="tile"><span>Conducción</span><strong>${x.dr}</strong></div><div class="tile"><span>Distancia</span><strong>${x.km}</strong></div><div class="tile"><span>Dormir</span><strong style="font-size:17px">${x.sl}</strong><a target="_blank" rel="noopener" href="${MQ(x.sq)}">Ver opciones en Maps</a></div>${x.pj?`<div class="tile"><span>Peajes (categoría I)</span><strong style="font-size:15px;font-weight:600;line-height:1.4">${x.pj}</strong></div>`:''}</div>
<div class="row" style="margin:0">${x.o?`<a class="btn sun" target="_blank" rel="noopener" href="${DIR(x.o,x.de)}">Ruta del día en Maps</a>`:''}<a class="btn" target="_blank" rel="noopener" href="${MQ(x.de)}">Ver destino</a></div>
<div class="stops">${x.s.map(stop).join('')}</div>
<div class="pn">${i?`<button class="btn" data-day="${i-1}">Día ${i}</button>`:'<span></span>'}${i<9?`<button class="btn sun" data-day="${i+1}">Día ${i+2}</button>`:''}</div></section>`}
function guide(){return `<section class="wrap"><h2>Dónde dormir y comer</h2><p class="sub">Zonas recomendadas y qué probar en cada parada. Los botones abren búsquedas en Google Maps con precios, fotos y reseñas actuales.</p>${G.map(g=>`<details><summary>${g[0]}</summary><div><p><b>Dormir:</b> ${g[1]} <a target="_blank" rel="noopener" href="${MQ('hoteles en '+g[4])}">Ver hoteles</a></p><p><b>Comer:</b> ${g[2]} <a target="_blank" rel="noopener" href="${MQ('restaurantes en '+g[4])}">Ver restaurantes</a></p><p><b>Consejo:</b> ${g[3]}</p></div></details>`).join('')}</section>`}
const fmt=n=>'$ '+Math.round(n).toLocaleString('es-CO');
const bv=k=>{const v=st.bud[k];return v==null?BD.find(b=>b[0]==k)[2]:+v};
function calc(){const b={};BD.forEach(x=>b[x[0]]=bv(x[0]));const r=[['Combustible',b.fuel],['Peajes',b.toll],['Alojamiento (9 noches)',b.hot*9*b.rooms],['Comida (10 días)',b.food*b.pax*10],['Actividades',b.act*b.pax]],s=r.reduce((a,c)=>a+c[1],0),e=s*b.ext/100,t=s+e;
$('#bd').innerHTML=r.map(x=>`<div class="f"><span>${x[0]}</span><b>${fmt(x[1])}</b></div>`).join('')+`<div class="f"><span>Imprevistos</span><b>${fmt(e)}</b></div>`;
$('#bt').innerHTML=`<p>Total estimado (COP)</p><strong>${fmt(t)}</strong><p>${fmt(t/b.pax)} por persona</p>`}
function bud(){return `<section class="wrap"><h2>Presupuesto</h2><p class="sub">Valores de referencia en pesos colombianos. Cámbialos por los precios reales que encuentres y el total se actualiza solo.</p>${BD.map(x=>`<label class="f"><span>${x[1]}</span><input type="number" inputmode="numeric" min="0" data-b="${x[0]}" value="${bv(x[0])}"></label>`).join('')}<div class="note" style="margin:16px 0"><b>Combustible:</b> la gasolina corriente cuesta cerca de $16.300 por galón (Bogotá $16.331 y Medellín $16.251 en noviembre de 2026; diciembre puede cambiar). Con unos 1.200 km y 30–35 km por galón gastarías unos 34–40 galones, es decir $560.000–$650.000.<br><br><b>Peajes, categoría I (carro particular):</b> Túnel de La Línea $12.400, El Santuario $18.000, Pavas $16.200, Amagá $20.600 y La Pintada $23.900. Puerto Triunfo está sin cobro por una protesta. No pude confirmar la lista completa de peajes de tu ruta exacta: $300.000 es una estimación (rango $250.000–$350.000).</div><div id="bd" style="margin-top:14px"></div><div class="tot" id="bt"></div></section>`}
function list(){return `<section class="wrap"><h2>Lista de preparación</h2><p class="sub">Marca lo que ya tienes resuelto; se guarda en este dispositivo.</p>${CK.map((g,gi)=>`<h3 class="g">${g[0]}</h3>${g[1].map((t,k)=>`<label class="ck"><input type="checkbox" data-chk="${gi}-${k}" ${st.chk[gi+'-'+k]?'checked':''}><span>${t}</span></label>`).join('')}`).join('')}</section>`}
const V={home,itin,guide,bud,list};
function go(t){st.tab=t;save();document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.t==t));$('#app').innerHTML=V[t]();watch();if(t=='bud')calc();scrollTo(0,0)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-go],[data-day],[data-dest],[data-done],[data-sw]');if(!t)return;const d=t.dataset;
if(d.t)go(d.t);else if(d.go)go(d.go);
else if(d.dest!=null){st.day=+d.dest;go('itin')}
else if(d.day!=null){st.day=+d.day;go('itin')}
else if(d.done){st.done[d.done]=!st.done[d.done];save();const on=st.done[d.done];t.setAttribute('aria-pressed',on);t.textContent=on?'Completada ✓':'Marcar completada';t.closest('.stop').classList.toggle('done',on);document.querySelector('.chips [aria-selected=true]').classList.toggle('ok',dayDone(st.day))}
else if(d.sw!=null){const el=t.parentNode;el.dataset.i=+el.dataset.i+1;load(el)}});
document.addEventListener('change',e=>{const c=e.target.dataset.chk;if(c){st.chk[c]=e.target.checked;save()}});
document.addEventListener('input',e=>{const b=e.target.dataset.b;if(b){st.bud[b]=Math.max(0,+e.target.value||0);save();calc()}});
go(st.tab&&V[st.tab]?st.tab:'home');
</script></body></html>
